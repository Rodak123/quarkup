<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing Web</title>

    <link rel="icon" type="image/png" href="favicon.png" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-text-50: #0a1109;
        --color-text-100: #132112;
        --color-text-200: #274323;
        --color-text-300: #3a6435;
        --color-text-400: #4e8646;
        --color-text-500: #61a758;
        --color-text-600: #81b979;
        --color-text-700: #a0ca9b;
        --color-text-800: #c0dcbc;
        --color-text-900: #dfedde;
        --color-text-950: #eff6ee;

        --color-bg-50: #0c1009;
        --color-bg-100: #182112;
        --color-bg-200: #304224;
        --color-bg-300: #486336;
        --color-bg-400: #608448;
        --color-bg-500: #78a45b;
        --color-bg-600: #93b77b;
        --color-bg-700: #aec99c;
        --color-bg-800: #c9dbbd;
        --color-bg-900: #e4edde;
        --color-bg-950: #f2f6ef;

        --color-primary-50: #0c1109;
        --color-primary-100: #182211;
        --color-primary-200: #2f4422;
        --color-primary-300: #476633;
        --color-primary-400: #5e8844;
        --color-primary-500: #76aa55;
        --color-primary-600: #91bb77;
        --color-primary-700: #adcc99;
        --color-primary-800: #c8ddbb;
        --color-primary-900: #e4eedd;
        --color-primary-950: #f1f6ee;

        --color-secondary-50: #091109;
        --color-secondary-100: #112213;
        --color-secondary-200: #224426;
        --color-secondary-300: #336638;
        --color-secondary-400: #44884b;
        --color-secondary-500: #55aa5e;
        --color-secondary-600: #77bb7e;
        --color-secondary-700: #99cc9e;
        --color-secondary-800: #bbddbf;
        --color-secondary-900: #ddeedf;
        --color-secondary-950: #eef6ef;

        --color-accent-50: #09110b;
        --color-accent-100: #112216;
        --color-accent-200: #22442c;
        --color-accent-300: #336642;
        --color-accent-400: #448859;
        --color-accent-500: #55aa6f;
        --color-accent-600: #77bb8c;
        --color-accent-700: #99cca8;
        --color-accent-800: #bbddc5;
        --color-accent-900: #ddeee2;
        --color-accent-950: #eef6f1;

        --color-ui-bg: var(--color-bg-50);
        --color-ui-text: var(--color-text-950);
        --color-ui-border: var(--color-bg-200);
      }

      @layer base {
        .light,
        [data-theme='light'] {
          --color-text-50: #eff6ee;
          --color-text-100: #dfedde;
          --color-text-200: #c0dcbc;
          --color-text-300: #a0ca9b;
          --color-text-400: #81b979;
          --color-text-500: #61a758;
          --color-text-600: #4e8646;
          --color-text-700: #3a6435;
          --color-text-800: #274323;
          --color-text-900: #132112;
          --color-text-950: #0a1109;

          --color-bg-50: #f1f6ee;
          --color-bg-100: #e4eedd;
          --color-bg-200: #c9ddbb;
          --color-bg-300: #adcc99;
          --color-bg-400: #92bb77;
          --color-bg-500: #77aa55;
          --color-bg-600: #5f8844;
          --color-bg-700: #476633;
          --color-bg-800: #304422;
          --color-bg-900: #182211;
          --color-bg-950: #0c1109;

          --color-primary-50: #f1f6ee;
          --color-primary-100: #e4eedd;
          --color-primary-200: #c8ddbb;
          --color-primary-300: #adcc99;
          --color-primary-400: #91bb77;
          --color-primary-500: #76aa55;
          --color-primary-600: #5e8844;
          --color-primary-700: #476633;
          --color-primary-800: #2f4422;
          --color-primary-900: #182211;
          --color-primary-950: #0c1109;

          --color-secondary-50: #eef6ef;
          --color-secondary-100: #ddeedf;
          --color-secondary-200: #bbddbf;
          --color-secondary-300: #99cc9e;
          --color-secondary-400: #77bb7e;
          --color-secondary-500: #55aa5e;
          --color-secondary-600: #44884b;
          --color-secondary-700: #336638;
          --color-secondary-800: #224426;
          --color-secondary-900: #112213;
          --color-secondary-950: #091109;

          --color-accent-50: #eef6f1;
          --color-accent-100: #ddeee2;
          --color-accent-200: #bbddc5;
          --color-accent-300: #99cca8;
          --color-accent-400: #77bb8c;
          --color-accent-500: #55aa6f;
          --color-accent-600: #448859;
          --color-accent-700: #336642;
          --color-accent-800: #22442c;
          --color-accent-900: #112216;
          --color-accent-950: #09110b;

          --color-ui-border: var(--color-bg-200);
          --color-ui-bg: var(--color-bg-50);
          --color-ui-text: var(--color-text-950);
        }

        /* Body font */
        @font-face {
          font-family: 'JetBrains Mono NerdFont';
          src: url('/fonts/JetBrainsMonoNerdFont-Regular.ttf')
            format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
        }

        /* Header/Title font */
        @font-face {
          font-family: 'Didact Gothic';
          src: url('/fonts/DidactGothic-Regular.ttf') format('truetype');
          font-weight: normal;
          font-style: normal;
          font-display: swap;
        }

        body {
          @apply bg-ui-bg text-ui-text antialiased transition-colors duration-200;
          font-family: 'JetBrains Mono NerdFont', monospace;
        }

        .article-content {
          /* Typography */
          h1,
          h2,
          h3,
          h4,
          h5,
          h6 {
            font-family: 'Didact Gothic', sans-serif;
            @apply font-extrabold tracking-tight leading-tight my-2;

            & + p {
              @apply mt-4;
            }
          }

          h1 {
            @apply text-7xl;
          }
          h2 {
            @apply text-4xl;
          }
          h3,
          h4,
          h5,
          h6 {
            @apply text-3xl;
          }
          p {
            @apply font-normal leading-relaxed text-start my-2;
          }

          /* Links */
          a {
            @apply relative font-bold no-underline transition-colors duration-300 inline-block;
            color: var(--color-ui-text);

            &::before {
              content: '';
              @apply absolute bottom-0.5 left-0 -z-10 w-full h-2 transition-all duration-300 ease-in-out;
              background-color: var(--color-accent-400);
              opacity: 0.6;
            }

            &:hover::before {
              @apply bottom-0 h-full opacity-80;
            }
          }

          /* Multiline code blocks */
          & > pre {
            @apply my-8 overflow-x-auto rounded bg-bg-200 px-1.5 py-0.5;
          }

          /* Inline code blocks */
          :not(pre) > code,
          mjx-container {
            @apply inline-block rounded bg-bg-200 px-1.5 py-0.5 text-secondary-600 transition-colors duration-200;
          }

          /* Writedown errors */
          *[data-writedown-error] {
            @apply block p-4 my-2 bg-red-800 rounded overflow-x-auto max-w-screen;
          }

          /* Lists */
          & > ul,
          & > ol {
            @apply ps-8;
          }

          & > ul {
            @apply list-none;
          }

          & > ol {
            @apply list-decimal;
          }

          & > ul > li::marker {
            content: '  ';
          }

          & li > ul,
          & li > ol {
            @apply ps-8;
          }

          & li > ul > li::marker {
            content: '󰋙  ';
          }

          /* Blockquotes */
          & > blockquote {
            @apply my-6 border-l-4 border-primary-500 bg-primary-500/5 px-6 py-4 italic text-text-700 rounded-r-md;

            p {
              @apply my-0;
            }
          }

          /* rehype-pretty-code */
          & > figure[data-rehype-pretty-code-figure] {
            @apply my-8 flex flex-col;

            & > figcaption {
              @apply ps-4 text-text-900;

              &::before {
                content: '# ';
                font-weight: bold;
              }
            }

            pre {
              @apply w-full overflow-x-auto rounded-xl py-4 shadow-lg;
            }
            code {
              @apply inline-block text-sm leading-6 lg:break-all lg:text-wrap;
              counter-reset: line;

              & > [data-line] {
                @apply border-l-4 border-l-transparent px-4;
                &::before {
                  counter-increment: line;
                  content: counter(line);
                  @apply mr-6 inline-block w-4 text-right opacity-50;
                }
              }
              & > [data-highlighted-line] {
                @apply border-l-primary-500 bg-primary-500/10;
              }
            }
          }

          /* rehype-mathjax */
          & > figure[data-math-block] {
            @apply my-8 flex justify-center;
            mjx-container {
              @apply flex! w-full justify-center overflow-x-auto rounded-xl border border-ui-border py-4 shadow-lg;
            }
          }

          /* Table of Contents */
          & > ul[data-toc] {
            @apply my-6 max-w-xs rounded-xl border border-ui-border bg-bg-100 p-6 shadow-sm list-none;

            li {
              @apply relative my-1;

              &::marker {
                content: none;
              }
            }

            /* reset custom link here */
            a {
              @apply block rounded-md px-2 py-1 text-sm text-text-400 hover:bg-primary-500/10 hover:text-primary-500;
              &::before {
                display: none;
              }
            }

            ul {
              @apply mt-1 ml-4 border-l border-ui-border pl-2 list-none;
            }

            & > li > p > a {
              @apply font-bold text-text-950;
            }
          }
        }
      }
    </style>
  </head>

  <body class="flex flex-col items-center">
    <div id="main" class="article-content p-4 md:max-w-3/4"></div>
    <button class="fixed right-12 bottom-12" id="toggle-theme-btn">
      Toggle Theme
    </button>
    <script src="script.js"></script>
  </body>
</html>
